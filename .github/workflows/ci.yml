# Minimal CI: runs the same guarded verification as local sessions.
# verify.sh skips stages whose toolchain doesn't exist yet, so this stays
# green through the pre-code stage and picks up backend/tests at M0.
# Growth points: Gradle cache at M0, `npm ci` for frontend tests at M1.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: verify
        run: bash scripts/verify.sh

      - name: upload verify log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: last-verify-log
          path: build/last-verify.log

      # verify.sh runs gradle with `-q`, which swallows the failing test names —
      # the log then says only "N tests completed, 1 failed". Added 2026-08-26 after
      # a failure that reproduced on CI but not locally: without these reports the
      # only way to find the test was to guess.
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pms/build/test-results/test/**/*.xml
            host/build/test-results/test/**/*.xml
            pms-mcp-mock/build/test-results/test/**/*.xml
          if-no-files-found: ignore
