// M-1 목업 MCP 서버 (구현_노트 부록 B) — mcp/·port/ 는 실전 계약, mock/ 은 폐기 예정
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
}

group = 'kr.proten'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// B2-2 수동 검증용 — HS256 테스트 토큰 출력 (기본 그룹 4종 대표)
tasks.register('printTestTokens', JavaExec) {
    group = 'application'
    description = 'Print HS256 test JWTs for manual /mcp verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.proten.pmsmock.TestJwt'
    systemProperty 'stdout.encoding', 'UTF-8' // Windows 콘솔 한글 라벨 깨짐 방지
    // 시크릿 정본은 application.yml 하나 — 상수 중복 드리프트 방지
    def yml = file('src/main/resources/application.yml').text
    systemProperty 'mock.jwt.secret', (yml =~ /secret:\s*(\S+)/)[0][1]
}

tasks.named('test') {
    useJUnitPlatform()
}
