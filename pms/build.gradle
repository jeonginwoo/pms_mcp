// 재구축 PMS 앱 (PRD-pms §3) — Modulith 모듈러 모놀리스.
// /mcp 어댑터는 이 앱에 임베디드되는 별도 모듈(구조 원칙 2)로, MCP 담당이 M0에서
// pms-mcp-mock의 mcp/·port/ 를 승격해 추가한다 — 이 트랙에서 만들지 않는다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
}

group = 'kr.proten'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation platform('org.springframework.modulith:spring-modulith-bom:2.1.0')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    // 이벤트 발행 레지스트리(spring-modulith-starter-jpa)는 §8 이벤트 도입 시(PMS-M3+) 추가
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
