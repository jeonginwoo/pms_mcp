// 재구축 PMS 앱 — Modulith 모듈러 모놀리스, 도메인별 모듈(person · project · common).
// 3계층(controller → service → repository)이며 JPA 엔티티가 곧 도메인 모델이다
// (2026-08-21 결정 — 구 api→application→domain←infra 육각형 구조 폐기).
// 인증·/mcp 어댑터·resource·maintenance·notification은 이 재구축 범위 밖 —
// 직전 구현은 ../pms-old 에 참고용으로 보존한다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
}

group = 'kr.proten'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation platform('org.springframework.modulith:spring-modulith-bom:2.1.0')
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
    // 웹 계층은 common의 에러 봉투 변환(@RestControllerAdvice)이 쓴다 —
    // 모듈별 controller 패키지는 인증 도입 시 채운다(호출자 식별이 전제)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 자체 로그인 — JWT 발급(RS256)·비밀번호 해시. pms.auth.enabled=false 동안에는
    // common/config의 전면 허용 체인이 걸린다(스타터가 있으면 기본이 전면 차단이므로)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    // 임베디드 /mcp 어댑터 (구조 원칙 2 — 별도 프로세스 금지). MCP 담당 소유분으로,
    // pms-old의 M0 승격분을 2026-08-23에 재승격했다. Streamable HTTP 전송은 이
    // 스타터가 /mcp 엔드포인트로 제공한다 — 직접 매핑하는 컨트롤러는 없다
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    // 도메인 이벤트 (2026-08-24 EPIC F). @ApplicationModuleListener만 쓰므로
    // events-api 하나면 된다 — 커밋 후 · 비동기 · 새 트랜잭션을 한 어노테이션이 뜻한다.
    implementation 'org.springframework.modulith:spring-modulith-events-api'
    // 이벤트 발행 **레지스트리**(spring-modulith-starter-jpa)는 아직 넣지 않는다
    // (2026-08-24 사용자 결정). 도메인 이벤트는 이번에 도입했지만 @ApplicationModuleListener는
    // 레지스트리 없이도 돌고, 레지스트리를 켜면 라이브러리 내부 테이블(event_publication)이
    // 우리 Flyway 마이그레이션에 들어와 버전 올릴 때마다 따라가야 한다.
    // 대가: 커밋 직후 앱이 죽으면 그 알림은 사라진다. 지금은 감수한다 — 과부하는
    // 가동률 화면에도 보여 알림이 유일한 통보 경로가 아니다.
    // 추가 트리거: 유실이 실제로 문제가 되거나, 알림이 유일한 경로인 기능이 생길 때.
    // Boot 4는 기술별 자동 구성이 스타터로 분리됨 — flyway-core 단독은 자동 구성이 없다
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 비동기 이벤트 단정용 — @ApplicationModuleListener는 커밋 후에 돌아 즉시 확인이 안 된다
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    // MockMvc 웹 슬라이스 — Boot 4에서 모듈 분리(@WebMvcTest·@AutoConfigureMockMvc가 이 스타터에)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 방언 타는 통합 테스트는 PG 실물 — H2 대체 금지 (conventions §8).
    // Testcontainers 2.x(Boot 4.1 BOM 관리)는 아티팩트가 testcontainers-* 로 개명됨
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}

// 시드 users 행의 password_hash 재생성용 — 초기 비밀번호는 부록 B 확정값이다.
// BCrypt는 매번 다른 솔트를 쓰므로 출력값이 달라도 모두 유효하다.
tasks.register('printPasswordHash', JavaExec) {
    group = 'application'
    description = 'Print a BCrypt hash for the seed initial password'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.proten.pms.person.PrintPasswordHash'
    systemProperty 'stdout.encoding', 'UTF-8'
}
