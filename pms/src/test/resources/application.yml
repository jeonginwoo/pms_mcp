# 테스트 기본값 — 테스트 클래스패스의 이 파일이 main의 application.yml을 대체한다.
# 데이터소스는 Testcontainers(@ServiceConnection)가 주입하므로 여기 없다.
spring:
  jpa:
    hibernate:
      # 스키마는 Flyway 소유 (main과 동일)
      ddl-auto: none
    open-in-view: false
  # --- /mcp 어댑터 (MCP 담당 소유 블록) ------------------------------------
  # 이 파일이 main의 application.yml을 통째로 가리므로 여기에도 있어야 한다.
  # protocol을 생략할 수 없다: 필드 기본값은 STREAMABLE이지만 자동 구성 조건이
  # `matchIfMissing = false`라(McpServerAutoConfiguration.EnabledStreamableServerCondition)
  # 프로퍼티가 없으면 SSE 쪽이 켜지고 POST /mcp 는 404가 된다.
  ai:
    mcp:
      server:
        name: pms
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC

pms:
  seed:
    # 시드 적재 비활성 — 테스트는 자체 픽스처를 쓴다. 43명이 함께 적재되면
    # "팀 범위가 정확히 N명" 같은 단정이 무너진다. 시드 적재 자체를 검증하는
    # PersonSeedLoadIntegrationTest만 @SpringBootTest(properties=…)로 켠다.
    path:
