# 로컬 개발 기본값 — DB는 docker-compose.yml의 PostgreSQL (운영 값은 배포 시 외부화)
spring:
  application:
    name: pms
  datasource:
    url: jdbc:postgresql://localhost:5432/pms
    username: pms
    password: pms
  flyway:
    # 스키마는 Flyway가 소유한다 — db/migration의 V__*.sql만이 정본
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # 엔티티로 스키마를 만들지 않는다 (2026-08-21 결정 — Flyway 전환)
      ddl-auto: none
    open-in-view: false

server:
  port: 8080

pms:
  auth:
    # 인증 스위치 — false면 보호 체인이 걸리지 않고 호출자를 X-Caller-Person-Id
    # 헤더로 받는다(헤더를 신뢰하므로 이 상태로 외부 노출 금지).
    # true로 올리면 person의 JWT 보호 체인이 활성화되고 호출자는 토큰 subject다.
    # 로그인·갱신·JWKS 라우트는 스위치와 무관하게 열려 있다.
    enabled: false
    # TTL 기본값은 코드(§7 확정: access 1h · refresh 14d) — 재정의 시에만 기입
    # access-ttl: 1h
    # refresh-ttl: 14d
  seed:
    # 조직·직급·권한 그룹·인원 시드 디렉터리 — 빈 값·미설정이면 적재하지 않는다.
    # 테스트는 설정하지 않는다(자체 픽스처와 충돌 방지 — PersonSeedLoader 주석).
    path: ../reference/seed
