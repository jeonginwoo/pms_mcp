# 로컬 개발 기본값 — DB는 docker-compose.yml의 PostgreSQL (운영 값은 배포 시 외부화)
spring:
  application:
    name: pms
  datasource:
    url: jdbc:postgresql://localhost:5432/pms
    username: pms
    password: pms
  jpa:
    hibernate:
      # ASSUMPTION: 개발 단계 스키마 관리 = update (단순·표준 — PMS-M0 유보 결정).
      # 스키마 안정화(시드 적재 이후) 시 Flyway 전환을 재검토한다.
      ddl-auto: update
    properties:
      hibernate:
        # 모듈별 스키마(§0) — 엔티티의 schema 지정을 DDL로 함께 생성
        hbm2ddl:
          create_namespaces: true
    open-in-view: false

server:
  port: 8080

# --- /mcp 어댑터 모듈 (MCP 담당 — 이하 블록 소유) -------------------------
spring.ai.mcp.server:
  name: pms
  version: 0.1.0
  protocol: STREAMABLE # 원칙 7(stateless 지향) — STATELESS 전환은 SDK 신 스펙 지원 후 검토
  type: SYNC

pms:
  auth:
    # jwks-uri: 실제 토큰 발급 체계(로그인/BFF 위임 — PMS-M1) 도입 시 설정. 설정되면 HS256보다 우선.
    #   → PMS-M1a부터 로그인 JWT(RS256) 발급 가동 — 사용 가능 값: http://localhost:8080/api/auth/jwks
    #     (전환 시점은 MCP 담당 몫 — HS256 테스트 토큰 흐름과 맞바꿈)
    # HS256 시크릿은 로컬·게이트 M0 검증 전용 — 운영 반입 금지 (구현_노트 B-3).
    # 테스트 토큰 발급: ./gradlew printTestTokens
    hs256-secret: pms-m0-hs256-local-gate-secret-0123456789-abcdefghij
    # 로그인 JWT TTL 기본값은 코드(§7 확정: access 1h·refresh 14d) — 재정의 시에만 기입
    # access-ttl: 1h
    # refresh-ttl: 14d
  mcp:
    # 임시 어댑터의 시드 원본 — identity 모듈 적재(PMS-M1)가 대체하면 제거
    seed-people-path: ../reference/seed/people.json
